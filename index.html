<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Municipales 2026 - Pour Penvénan</title>

    <!-- Styles -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444 !important;
            border-radius: 0px;
        }

        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        .ol-control > *:hover {
            background-color: rgba(248, 248, 248, 0.7) !important;
        }

        /* POPUP STYLE */
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.25);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #cccccc;
            min-width: 260px;
            max-width: 380px;
            max-height: 320px;
            overflow-y: auto;
        }

        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 18px;
            color: #444;
        }

        .ol-popup-closer::after {
            content: "✕";
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- Popup -->
<div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>
</div>

<!-- Scripts -->
<script src="resources/qgis2web_expressions.js"></script>
<script src="resources/proj4.js"></script>
<script>proj4.defs('EPSG:4326', '+proj=longlat +datum=WGS84 +no_defs');</script>

<script src="./resources/ol.js"></script>
<script src="./resources/ol-layerswitcher.js"></script>
<script src="./resources/functions.js"></script>
<script src="./resources/Autolinker.min.js"></script>
<script src="resources/photon-geocoder-autocomplete.min.js"></script>

<!-- Layers -->
<script src="layers/Limitescommunale_2.js"></script>
<script src="layers/LabelMonumentshistorique_3.js"></script>
<script src="layers/ZonedePresomptionArcheologique_4.js"></script>
<script src="layers/Patrimoinelineaire_5.js"></script>
<script src="layers/Siteshistoriques_6.js"></script>
<script src="layers/Voiesdedplacement_7.js"></script>
<script src="layers/Axesduprogramme_8.js"></script>

<!-- Styles -->
<script src="styles/Limitescommunale_2_style.js"></script>
<script src="styles/LabelMonumentshistorique_3_style.js"></script>
<script src="styles/ZonedePresomptionArcheologique_4_style.js"></script>
<script src="styles/Patrimoinelineaire_5_style.js"></script>
<script src="styles/Siteshistoriques_6_style.js"></script>
<script src="styles/Voiesdedplacement_7_style.js"></script>
<script src="styles/Axesduprogramme_8_style.js"></script>

<script src="./layers/layers.js"></script>
<script src="./resources/qgis2web.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var container = document.getElementById('popup');
    var content = document.getElementById('popup-content');
    var closer = document.getElementById('popup-closer');

    // Création overlay OpenLayers
    var overlay = new ol.Overlay({
        element: container,
        autoPan: true,
        autoPanAnimation: { duration: 250 }
    });

    map.addOverlay(overlay);

    // Fermeture uniquement via la croix
    closer.onclick = function (evt) {
        evt.preventDefault();
        overlay.setPosition(undefined);
        closer.blur();
        return false;
    };

    // Empêche la carte de zoomer quand on scroll dans le popup
    container.addEventListener('wheel', function(e) {
        e.stopPropagation();
    });

    // Ouvre popup au clic sur un symbole
    map.on('singleclick', function (evt) {

        var feature = map.forEachFeatureAtPixel(evt.pixel, function (feature) {
            return feature;
        });

        if (feature) {

            var props = feature.getProperties();
            var html = "<h3>" + (props.nom || "Information") + "</h3>";

            for (var key in props) {
                if (key !== 'geometry') {
                    html += "<p><strong>" + key + " :</strong> " + props[key] + "</p>";
                }
            }

            content.innerHTML = html;
            overlay.setPosition(evt.coordinate);
        }

        // IMPORTANT : on ne ferme pas le popup si clic ailleurs
    });

});
</script>

</body>
</html>
