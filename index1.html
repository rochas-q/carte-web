        /**
         * Supprime les lignes vides du contenu d'un popup.
         */
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        /**
         * Ajoute une classe CSS au popup si son contenu contient un média
         * (image, audio, vidéo).
         */
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function () { popup.update(); }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = '400px';
                    video.style.height = '300px';
                    video.style.maxHeight = '60vh';
                    video.style.maxWidth = '60vw';
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function () { popup.update(); });
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        /**
         * Construit une cellule de popup à partir d'une valeur de propriété.
         * Retourne une chaîne <td> prête à insérer dans un <tr>.
         */
        function propCell(value, label, extraClass, extraId) {
            var val = (value !== null && value !== undefined)
                ? autolinker.link(String(value).replace(/'/g, "\u2019").toLocaleString())
                : '';
            var classAttr = extraClass ? ' class="' + extraClass + '"' : '';
            var idAttr   = extraId   ? ' id="' + extraId + '"'     : '';
            var labelHtml = label ? '<strong>' + label + '</strong><br />' : '';
            return '<td colspan="2"' + classAttr + idAttr + '>' + labelHtml + val + '</td>';
        }

        /* Styles par type de site historique */
        var ICON_SIZE = [15.2, 15.2];
        var DEFAULT_ROTATION = 0.5934122;

        function makeIconStyle(pane, iconUrl, rotation) {
            return {
                pane: pane,
                rotationAngle: (rotation !== undefined) ? rotation : DEFAULT_ROTATION,
                rotationOrigin: 'center center',
                icon: L.icon({ iconUrl: iconUrl, iconSize: ICON_SIZE }),
                interactive: true
            };
        }

        var SITE_STYLES = {
            'Bunker':                   function (pane) { return makeIconStyle(pane, 'markers/bunker.svg'); },
            'Calvaire':                 function (pane) { return makeIconStyle(pane, 'markers/christian.svg'); },
            'Fontaine':                 function (pane) { return makeIconStyle(pane, 'markers/fountain.svg'); },
            'Lavoir':                   function (pane) {

                    opacity: 1, color: 'rgba(255,0,0,1.0)', dashArray: '',
                    lineCap: 'butt', lineJoin: 'miter', weight: 1.0,

                    interactive: true

            },
            'Manoir':                   function (pane) { return makeIconStyle(pane, 'markers/manor.svg'); },

            'Ruines':                   function (pane) { return makeIconStyle(pane, 'markers/tower_defensive.svg'); },
            'Sanctuaire de bord de route': function (pane) { return makeIconStyle(pane, 'markers/christian_1.svg'); },
            'Chapelle':                 function (pane) { return makeIconStyle(pane, 'markers/bell_tower.svg'); },
            'Site archaeologique':      function (pane) { return makeIconStyle(pane, 'markers/archaeological_site.svg', 0.5585056); },
            'Maison':                   function (pane) { return makeIconStyle(pane, 'markers/house.svg'); },
            'Moulin':                   function (pane) { return makeIconStyle(pane, 'markers/windmill.svg'); },
            'Monument Lindeberg':       function (pane) { return makeIconStyle(pane, 'markers/museum.svg'); },
            'Puit':                     function (pane) { return makeIconStyle(pane, 'markers/fountain.svg', 0.0); },
            'Pêcherie':                 function (pane) { return makeIconStyle(pane, 'markers/fish.svg'); }
        };

        (function () {
            function adjustLayersListHeight() {
                var scrollEl = document.querySelector('.leaflet-control-layers-scrollbar');
                if (scrollEl) {
                    var listEl = document.querySelector('.leaflet-control-layers-list');
                    var currentHeight = parseFloat(listEl.style.height || window.getComputedStyle(listEl).height);
                    listEl.style.height = (currentHeight - 50) + 'px';
                }
            }

            var isExpanded = true;
            var controlEl  = document.querySelector('.leaflet-control-layers');
            var toggleBtn  = document.querySelector('.leaflet-control-layers-toggle');

            toggleBtn.addEventListener('click', function () {
                if (isExpanded) {
                    controlEl.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlEl.classList.add('leaflet-control-layers-expanded');
                }
                isExpanded = !isExpanded;
                adjustLayersListHeight();
            });

            if (controlEl) {
                controlEl.addEventListener('click', function (event) {
                    if (event.target.closest('.leaflet-layerstree-header-pointer span')) {
                        adjustLayersListHeight();
                    }
                });
            }

            /* Double clic simulé pour forcer l'initialisation correcte du contrôle */
            setTimeout(function () { toggleBtn.click(); }, 10);
            setTimeout(function () { toggleBtn.click(); }, 20);

            /* Sur petit écran : replier le panneau automatiquement */
            if (window.innerWidth < 650) {
                setTimeout(function () {
                    controlEl.classList.remove('leaflet-control-layers-expanded');
                    isExpanded = false;
                }, 500);
            }
        })();
